# GitHub Pages shim: the same build path as every other provider
# (bin/build.sh), delivered via the official pages artifact flow.
# Enable once in the fork: Settings → Pages → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'tools/hugo/**'
      - 'records/**'
      - 'static/**'
      - 'tools/pandoc/**'
      - 'tools/pwa/**'
      - 'bin/build.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    # GitHub only — Forgejo/Gitea read .github/workflows as a fallback.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Optional pre-flight: records doctor. recordkit ships in-repo, needs
      # only python3; skip cleanly, like bin/build.sh's pandoc check, when
      # it's missing.
      - name: Doctor (optional pre-flight)
        run: |
          if command -v python3 >/dev/null 2>&1 && [ -d tools/others/python/recordkit ]; then
            PYTHONPATH="$(pwd)/tools/others/python" python3 -m recordkit doctor --repo "$(pwd)"
          else
            echo "doctor: python3 or recordkit not found — skipping pre-flight (recordkit is optional)" >&2
          fi

      # Pinned, like the Forgejo path's runner image — 'latest' meant the two
      # deploy paths could build with different Hugos on the same commit.
      # Raising it: docs/toolchain.md.
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true
      - id: pages
        uses: actions/configure-pages@v5
      # configure-pages hands us the exact site URL (project page, user
      # site or custom domain); bin/build.sh normalizes and builds.
      - name: Build
        run: BASE_URL="${{ steps.pages.outputs.base_url }}" ./bin/build.sh "$GITHUB_WORKSPACE/public"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
