# Site URL — uncomment to make it authoritative everywhere (bin/build.sh
# stops deriving and uses it as-is; needed for custom domains and rsync/VPS).
# Commented out: CI derives the URL per fork (zero-edit forks); manual
# bin/build.sh runs then need BASE_URL set or fail with a pointer here.
# baseURL: https://blyant.codeberg.page/records/
locale: en-no
title: blyant records

# The default branding theme; all design lives in tools/hugo/themes/Fuglekasse/.
theme: Fuglekasse
# OR — Postkasse, the growth theme: same site, same params, but with an assets
# pipeline and room for JavaScript (see tools/hugo/themes/Postkasse/README.md).
# theme: Postkasse

# records/ is the single source of truth for content.
contentDir: ../../records
# OR
# contentDir: ../../docs/records

# Files never to publish: write gitignore-shaped patterns in
# records/.recordsignore (one per line, # for comments) and run `records
# ignore`. It translates them into a generated `ignoreFiles:` block right here,
# between "# records-ignore:begin" and "# records-ignore:end" markers — the one
# exclusion mechanism the build already has. Hugo reads ignoreFiles; so does
# tools/pandoc/book.lua, so the site, the PDF and the EPUB agree. The block is
# generated: edit .recordsignore and re-run, never the block. `records ignore
# --check` writes nothing and exits non-zero when the two have drifted, which is
# what CI should run.
#
# Supported patterns: `private/` (that directory at any depth), `secret.md` or
# `notes/draft.md` (that exact path, at any depth), `*.env` (a suffix), and
# `re: <regex>` to pass a raw regex straight through. Not supported, each with a
# message saying why: `!negation` (ignoreFiles is a block list), a leading `/`
# (Hugo matches absolute paths, so "only at the root" cannot be expressed), and
# `?`, `[…]` or a `*` anywhere but the start (book.lua's regex subset has no way
# to match them). One pattern usually yields two regexes — Hugo matches against
# absolute paths, book.lua against records-relative ones.
#
# Precedence and interactions:
#   - ignoreFiles wins over everything. Hugo never reads the file, so front
#     matter in it — draft:, build:, cascade — is never seen at all.
#   - draft: true is the *reversible* route and the one `records unpublish`
#     uses: Hugo and book.lua both skip drafts, but the file is still parsed.
#     Ignore a file to keep it out of the build; draft it to withdraw a record.
#   - params.demoMode counts real records, and an ignored file is not one. If
#     you ignore your only record, the shipped demo content comes back.
#   - The patterns are global to the build, not records-only: `private/` would
#     also exclude static/private/. Name patterns you mean.
#   - An ignored file is still in the repository and still in git history. This
#     is about not publishing, not about secrecy — see docs/oops.md.

# Repo-root static/ holds your own assets (logo, favicon, images) — like
# records/, it is fork-owned: upstream never ships or moves files there.
staticDir: [static, ../../static]

# Repo-root data/ feeds site.Data. data/models.json is the shipped list of
# vendor/model name tokens (claude, gpt, gemini, …) that record.html strips
# from signature lines on top of the built-in single-token regex; forks add
# private extras in the gitignored data/models_local.json (local builds only).
dataDir: ../../data

# The generator meta tag names the software, not Hugo: the themes emit
# "blyant records <version>" from the repo-root CURRENT file (werden cycle),
# mounted into assets because readFile cannot leave the project dir.
disableHugoGeneratorInject: true
module:
  mounts:
    - source: ../../CURRENT
      target: assets/CURRENT

# The explicit date: field is authoritative (ordering follows it, not the
# filename); timestamp-named records without a date: fall back to the filename.
frontmatter:
  date: [':default', ':filename']

# Time zone for interpreting dates without a UTC offset (front matter date:
# and filename timestamps), so CI builds on UTC machines keep your wall-clock
# times. A root config key — the theme can't ship a default, so it lives here.
timeZone: Europe/Oslo

# Filename date extraction strips the date prefix from the slug
# (/18-41/ would collide across days); use the full filename as URL.
permalinks:
  page:
    /: /:contentbasename/

# Records are trusted first-party transcripts.
markup:
  goldmark:
    renderer:
      unsafe: true
  # Emit Chroma token classes (not inline colours) so the theme's syntax
  # CSS can switch with light/dark like the rest of the palette.
  highlight:
    noClasses: false

# No taxonomies; no RSS — the embedded RSS template would leak the
# assistant signature lines through page summaries.
# MIRRORED in one-page.yaml (list keys replace across config files) — edit both.
disableKinds: [taxonomy, term, rss]
# OR — with theme: Postkasse only, swap the line above for the one below to
# publish /index.xml. Postkasse ships its own feed template (layouts/rss.xml)
# that strips signature lines through the same partial record.html uses and
# carries full record content. Fuglekasse has no such template: leaving RSS on
# under Fuglekasse publishes Hugo's embedded feed, signatures and all — which
# is why this is a knowing, theme-specific edit and not a default.
# MIRROR this in one-page.yaml too. See tools/hugo/themes/Postkasse/README.md.
# disableKinds: [taxonomy, term]

# Site-wide search (theme: Postkasse only) needs one extra output on the home
# page: Hugo's built-in "json" format, which Postkasse fills from
# layouts/home.json.json and publishes as /index.json — every record's title,
# date, tags, link and text, signature lines stripped by the same partial the
# page uses. Uncomment together with params.showSearch below. A theme cannot
# turn this on for you: outputFormats and mediaTypes do merge from a theme
# config, but `outputs` does not — the same reason RSS needs the edit above.
# Under Fuglekasse this line is harmless but pointless: no json template
# matches, so Hugo warns and writes nothing.
# NOTE: `outputs` REPLACES Hugo's defaults — a site that enabled RSS above
# must list it here too ([html, rss, json]) or the feed silently disappears.
# outputs:
#   home: [html, json]           # with RSS enabled: [html, rss, json]

# Tag folders (records/<tag>/) organise files only — never render their
# auto-generated section pages, so /linux/ stays a 404 and stays out of the
# sitemap. The records inside keep their /linux/<slug>/ URLs.
# MIRRORED in one-page.yaml (list keys replace across config files) — edit both.
cascade:
  - target:
      kind: section
    build:
      render: never
      list: never

# Repo URL for the footer link and raw-link rewrites. Commented out = CI
# derives it per fork (like baseURL); uncommented = authoritative everywhere.
params:
  # repoURL: https://codeberg.org/blyant/records
  # Set to false to hide the footer repo link; repoURL keeps rewriting
  # relative records/ links either way. Fuglekasse defaults to true.
  # showRepoURL: false

  # Deploy command /cpd runs from the repo root after commit + push.
  # Commented out = the push-triggered Pages workflow deploys, nothing to run.
  # Point it at your own mechanism, also further up the file tree, e.g.
  # "./deploy.sh", "../deploy.sh" or "make -C ../.. deploy".
  # deployCommand: ./deploy.sh

  # Local publishing via `records publish` (no CI needed): build, then deliver.
  #   pages-branch — force-push the built site to publishBranch on publishRemote
  #                  (Codeberg serves branch "pages" natively; GitHub: Settings
  #                  → Pages → Deploy from a branch)
  #   rsync        — rsync -az --delete to publishDest (any static webroot)
  # Unset = CI publishes on push; nothing to run locally.
  # publishTarget: pages-branch
  # publishBranch: pages
  # publishRemote: origin
  # publishDest: user@host:/var/www/site/

  # Ship tools/pwa/ — a page that composes a record and commits it through your
  # forge's API — at this path segment, e.g. https://your.site/skriv/. It keeps a
  # forge access token in the browser's local storage, so it is off unless named.
  # Needs CORS on your forge: Codeberg has it, self-hosted Forgejo ships without.
  # See docs/app.md.
  # phoneApp: skriv

  # Serve static assets (favicon, font, logo, pdf/epub/booklet) from a CDN pull zone
  # that fetches from this site's URL. Production builds only — local dev
  # stays site-relative. Unset serves everything from the site itself.
  # cdnURL: https://example.b-cdn.net/

  # Loud hand-written greeting atop the home page; set your own word or remove.
  greeting: Velkommen

  # Demo content: the theme ships an example record (and the default front
  # page) so a fresh fork is a working site out of the box. true shows the
  # demo records only while records/ has no real records — your first record
  # hides them automatically, nothing to edit. false never shows them.
  # Fuglekasse defaults to false.
  demoMode: true

  # Search-result snippet, <meta name="description">. Left unset it is derived
  # at every build so it never goes stale: the opening 14 words of the newest
  # record on the front page, of the page itself on a record page, with the
  # speaker headings, "— model" signatures and code blocks stripped first.
  # Uncomment for a fixed line on the front page instead; a single record
  # overrides either with description: in its own front matter.
  # description: "Conversations with a machine, kept in the open."

  # Link-preview image (og:image) — a file in static/, about 1200x630. Must be
  # a raster format: the crawlers that build previews in chat apps do not
  # render SVG, which is why this does not fall back to params.logo.
  # ogImage: preview.png

  # Per-record link-preview cards (theme: Postkasse only) — bin/build.sh runs
  # `records card` over every record into public/cards/ and each record page's
  # og:image points at its own 1200x630 SVG quote card; the home page keeps
  # ogImage. Skipped in the one-page modes and when python3/recordkit is
  # absent. SVG previews render in Slack/Discord but not on many crawlers.
  # ogCards: true

  # Site-wide search (theme: Postkasse only) — a magnifier beside the site
  # title on every page, opening a panel that queries the build-time
  # /index.json in the browser. No service and no library; "/" opens it, and a
  # reader without JavaScript sees no search affordance at all. Needs the
  # `outputs:` block above uncommented too — with the param on and the output
  # missing, the build warns and shows nothing.
  # showSearch: true

  # How much of each record reaches that index. 0 (the default) indexes the
  # whole text — honest search, and the largest file the site serves. A number
  # indexes the opening N words instead; titles and tags are always indexed in
  # full either way. Measured on the synthetic corpus at 0:
  #       100 records —  363 KB raw,  111 KB gzip
  #     1 000 records —  4.1 MB raw,  1.2 MB gzip   (~4.2 KB per record)
  # so 10 000 records extrapolates to ~41 MB raw / ~12 MB gzip, which is not a
  # file to hand a browser. searchWords: 120 holds those same 1 000 records to
  # 843 KB raw / 249 KB gzip — ~0.9 KB per record, whatever the archive grows
  # to. Rule of thumb: the whole text up to a few thousand records, a number
  # past that. Either way the index is fetched on the first search, never on
  # page load. See the theme README.
  # searchWords: 120

  # Home page layout — Fuglekasse defaults to "basic"; uncomment to change.
  #   basic  — link index (default)
  #   posts  — latest N records as an excerpt feed (postsCount sets N, default 3)
  #   single — one-page document stack, _index.md on top, records per singleOrder
  #   single-flowing — one continuous conversation: only the Human/Assistant
  #            turns, no titles/tags/dates/chapters, records split by a "· · ·"
  #            divider; ordered by date per singleOrder (PDF/EPUB follow suit)
  # Both single modes publish one page: bin/build.sh merges one-page.yaml, so
  # the site is index.html + 404.html + your static files, books and record
  # attachments — no per-record URLs and no sitemap. A plain `hugo`/`hugo
  # server` run here skips that merge and still writes the record pages.
  # pageMode: single
  postsCount: 3

  # single/single-flowing mode record order: "asc" (oldest→newest, top→bottom,
  # default) or "desc" (newest at top). No effect in basic/posts modes.
  # singleOrder: asc

  # Book look (single-flowing mode only): three specially named files in
  # records/ become book furniture — forside.md the front cover (rendered
  # first, replacing the _index.md intro), side-1.md page 1 right after it,
  # bakside.md the back cover, always last. Dated records flow between them
  # per singleOrder; the PDF/EPUB drop their generated cover for forside and
  # give each special file its own page. All three are optional. Off by default.
  # bookLook: true

  # Anchored separators (single-flowing mode only): the · · · dinkus between
  # records becomes a clickable link with a stable 5-character id, and one is
  # added above the first record too, so every point in the stream is a
  # shareable #anchor. Ids are derived from each record's slug (same every
  # build). Off by default; uncomment to enable.
  # threeDotAnchor: true

  # Time-gap labels (single-flowing mode only): a small dim line in each
  # record's top-right corner saying how much earlier it is than the newest one
  # — "3 days earlier", "1 year and 2 months earlier". The newest record shows
  # its own date there instead (dateTitleFormat, else 2006-01-02). Approximate
  # by design (30-day months, twelve-month years) and recomputed every build,
  # so the labels follow the newest record. Web rendering is Postkasse-only;
  # the PDF/EPUB follow the param whatever the theme. Off by default;
  # uncomment to enable.
  # showTimeEarlier: true

  # Chapter fold state in basic/single modes (numbered records/<n>/ folders):
  #   latest    — open the chapter holding the newest record, collapse the rest (default)
  #   expanded  — every chapter open
  #   collapsed — every chapter closed
  # A chapter's records/<n>/_index.md can override this with `chapterOpen: true`
  # or `chapterOpen: false`.
  # chapterState: latest

  # Floating table of contents: a collapsed button pinned top-right on the home
  # page (all modes but posts) that opens to the chapters and their records.
  # Off by default; uncomment to enable.
  # showToc: true

  # Record filter (single mode only): a funnel button pinned bottom-left
  # (beside the Spotify logo when set) that opens a panel to filter the record
  # cards by tags, language and date range. Filter state lives in the URL
  # (?tags=a,b&language=nb,none&from=2026-01-01&to=2026-12-31), so filtered
  # views are shareable links. Off by default; uncomment to enable.
  # showFilter: true

  # Render timestamp-fallback record titles as formatted dates, using Go/Hugo
  # date layout syntax (https://gohugo.io/methods/time/format/).
  # Remove to keep raw titles like "2026-07-06_23-25". Examples:
  #   "January 2, 2006"  → July 6, 2026    (US)
  #   "2 January 2006"   → 6 July 2026     (UK)
  #   "2006年1月2日"      → 2026年7月6日    (Chinese)
  #   "02.01.2006"       → 06.07.2026      (Russian, German)
  dateTitleFormat: "02. January 2006"

  # Show the record's date bottom-right in each post (same Go/Hugo layout
  # syntax). Remove to show no post date; a single record can opt out with
  # `showDate: false` in its front matter.
  datePostFormat: "02. January 2006 15:04"

  # Records tagged in front matter (tags: [linux, hardware]) show dim
  # "#linux #hardware" labels under the post — display only, no tag pages.
  # On by default; uncomment to hide site-wide. A single record can opt out
  # with `showTags: false` in its front matter.
  # showTags: false

  # The whole site as one PDF, built by the Pages workflow with the tooling in
  # pandoc/ and served from the site root; the footer shows a "Get PDF" link.
  # The value is the filename. Uncomment to enable both build and link.
  # pdf: blyant.pdf

  # The whole site as one EPUB, built by the same workflow step and served from
  # the site root; the footer shows a "Get EPUB" link. The value is the
  # filename. Uncommend to enable both build and link.
  # epub: blyant.epub

  # The book as a paper-saving print booklet: A5 pages on a white (ink-saving)
  # background, two-up on A4 landscape sheets in folding order — print
  # two-sided (flip on short edge),
  # fold the stack in half, and four site pages share each sheet of paper.
  # With bookLook, forside and side-1 get a blank verso after them (each opens
  # on a right-hand A5 page) and bakside stays the very last page, sharing the
  # outer sheet with forside as the folded book's back cover.
  # Built by the same workflow step (needs pypdf next to WeasyPrint); the
  # footer shows a "Get booklet" link. The value is the filename.
  # booklet: blyant-booklet.pdf

  # Brand mark pinned to the bottom-right corner of every page. Point it at a
  # file in the repo-root static/ (or the theme's); remove to show none.
  logo: fuglekasse.svg

  # Size of that mark: default (48px), bigger-1 (+25%), bigger-2 (+50%),
  # bigger-3 (+100%). The bigger steps only apply on screens wider than
  # 48rem — phones always get the default size.
  # logoSize: bigger-1

  # Browser-tab icon (<link rel="icon">). Point it at a file in the repo-root static/;
  # unset falls back to the shipped fuglekasse.svg. Kept separate from logo
  # since favicons are square and logos are often not.
  # favicon: fuglekasse.svg

  # Spotify logo pinned to the bottom-left corner of every page, opposite
  # params.logo. Click opens the embedded player above it. Takes the
  # playlist's share URL (https://open.spotify.com/playlist/<id>) or embed
  # URL — both work. Unset shows no Spotify logo.
  # spotify: https://open.spotify.com/playlist/<id>
  spotify: https://open.spotify.com/playlist/4O49cydRwgT8wBITSY2Zgn?si=3bd2ea5ec828431b

  # Per-record "Comment" link (record pages and single-mode cards): points at
  # your forge's new-issue endpoint and prefills the title with
  # "[<site> - #<record-slug>]: ". commentSite overrides the site label
  # (defaults to the baseURL host — set it when serving under a custom
  # domain). Unset shows no Comment links.
  # commentURL: https://codeberg.org/you/yourrepo/issues/new
  # commentSite: example.com

  # Look & feel — Fuglekasse ships these defaults; uncomment a line to override.
  # style:
  #   font: Architects Daughter
  #   light: { bg: "#d5d6db", fg: "#343b58", dim: "#5a5d67", accent: "#34548a", surface: "#e5e6ea", card: "#f5f5f7" }
  #   dark:  { bg: "#282a36", fg: "#f8f8f2", dim: "#8b96c9", accent: "#bd93f9", surface: "#21222c", card: "#323445" }
