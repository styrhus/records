# Build the Hugo site (hugo/ config, records/ as content) and deploy to
# Codeberg Pages at https://tb4.codeberg.page/hugo-runner-image.
# Dogfoods the hugo-runner image this repo builds; :latest on purpose,
# so every image rebuild is exercised by the next site deploy.
name: Deploy to Codeberg Pages

on:
  push:
    branches: [main]
    paths:
      - 'hugo/**'
      - 'records/**'
      - '.forgejo/workflows/pages.yml'
  workflow_dispatch:

jobs:
  build-deploy:
    # Codeberg only. On git.euh.no no runner carries the label below, so
    # the job is never picked up there; this guard documents the intent
    # and protects if such a label ever appears.
    if: github.server_url == 'https://codeberg.org'
    runs-on: codeberg-tiny-lazy
    container:
      image: codeberg.org/tb4/hugo-runner:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cd hugo
          hugo --minify --destination "$GITHUB_WORKSPACE/public"

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: 'https://tb4.codeberg.page/hugo-runner-image'
          server: codeberg.page
          token: ${{ forge.token }}
          source: public/
