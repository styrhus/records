# Build the Hugo site (tools/hugo/ config, records/ as content) and deploy to
# Codeberg Pages at https://<owner>.codeberg.page/<repo>/ — owner, repo
# and repo URL are derived from the push by bin/build.sh, so forks publish
# their own site with zero edits. hugo-runner (node + git + Hugo +
# pandoc/WeasyPrint) is maintained in its own repo; :latest so deploys pick
# up runner updates without edits here.
name: Deploy to Codeberg Pages

on:
  push:
    branches: [main]
    paths:
      - 'tools/hugo/**'
      - 'records/**'
      - 'static/**'
      - 'tools/pandoc/**'
      - 'bin/build.sh'
      - '.forgejo/workflows/pages.yml'
  workflow_dispatch:

jobs:
  build-deploy:
    # Codeberg only. On git.euh.no no runner carries the label below, so
    # the job is never picked up there; this guard documents the intent
    # and protects if such a label ever appears.
    # Both slash forms: Forgejo v16 evaluates job-level if server-side
    # (forgejo/forgejo#13030), where server_url is AppURL with a trailing
    # slash; runner-side evaluation yields it without.
    if: github.server_url == 'https://codeberg.org' || github.server_url == 'https://codeberg.org/'
    runs-on: codeberg-tiny-lazy
    container:
      image: codeberg.org/tb4/hugo-runner:latest
    steps:
      - uses: actions/checkout@v4

      # Site + books (pdf/epub/booklet self-gate on their params) into
      # public/; PAGES_URL reaches the deploy step via $GITHUB_ENV.
      - name: Build
        run: ./bin/build.sh "$GITHUB_WORKSPACE/public"

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: ${{ env.PAGES_URL }}
          server: codeberg.page
          token: ${{ forge.token }}
          source: public/
