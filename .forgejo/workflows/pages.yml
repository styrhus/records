# Build the Hugo site (tools/hugo/ config, records/ as content) and deploy to
# Codeberg Pages at https://<owner>.codeberg.page/<repo>/ — owner, repo
# and repo URL are derived from the push, so forks publish their own
# site with zero edits. hugo-runner (node + git + Hugo + pandoc/WeasyPrint)
# is maintained in its own repo; :latest so deploys pick up runner updates
# without edits here.
name: Deploy to Codeberg Pages

on:
  push:
    branches: [main]
    paths:
      - 'tools/hugo/**'
      - 'records/**'
      - 'tools/pandoc/**'
      - '.forgejo/workflows/pages.yml'
  workflow_dispatch:

jobs:
  build-deploy:
    # Codeberg only. On git.euh.no no runner carries the label below, so
    # the job is never picked up there; this guard documents the intent
    # and protects if such a label ever appears.
    # Both slash forms: Forgejo v16 evaluates job-level if server-side
    # (forgejo/forgejo#13030), where server_url is AppURL with a trailing
    # slash; runner-side evaluation yields it without.
    if: github.server_url == 'https://codeberg.org' || github.server_url == 'https://codeberg.org/'
    runs-on: codeberg-tiny-lazy
    container:
      image: codeberg.org/tb4/hugo-runner:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          PAGES_URL="https://${OWNER}.codeberg.page/${NAME}/"
          echo "PAGES_URL=${PAGES_URL}" >> "$GITHUB_ENV"
          cd tools/hugo
          HUGO_PARAMS_REPOURL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            hugo --minify --baseURL "${PAGES_URL}" --destination "$GITHUB_WORKSPACE/public"

      # Renders the records into public/<params.pdf>, public/<params.epub>
      # and/or public/<params.booklet> with the tooling in tools/pandoc/ (pandoc +
      # WeasyPrint are baked into the runner image; the booklet also needs
      # pypdf there, else build.sh skips it); a no-op when all params are unset.
      - name: Build PDF, EPUB and booklet
        run: |
          if ! grep -Eq '^[[:space:]]*(pdf|epub|booklet):' tools/hugo/hugo.yaml; then
            echo "params.pdf/epub/booklet unset — skipping book build"
            exit 0
          fi
          HUGO_PARAMS_REPOURL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            ./tools/pandoc/build.sh "$GITHUB_WORKSPACE/public"

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: ${{ env.PAGES_URL }}
          server: codeberg.page
          token: ${{ forge.token }}
          source: public/
