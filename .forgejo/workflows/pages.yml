# Build the Hugo site (hugo/ config, records/ as content) and deploy to
# Codeberg Pages at https://<owner>.codeberg.page/<repo>/ — owner, repo
# and repo URL are derived from the push, so forks publish their own
# site with zero edits. hugo-runner (node + git + Hugo) is maintained in
# its own repo; :latest so deploys pick up runner updates without edits here.
name: Deploy to Codeberg Pages

on:
  push:
    branches: [main]
    paths:
      - 'hugo/**'
      - 'records/**'
      - '.forgejo/workflows/pages.yml'
  workflow_dispatch:

jobs:
  build-deploy:
    # Codeberg only. On git.euh.no no runner carries the label below, so
    # the job is never picked up there; this guard documents the intent
    # and protects if such a label ever appears.
    if: github.server_url == 'https://codeberg.org'
    runs-on: codeberg-tiny-lazy
    container:
      image: codeberg.org/tb4/hugo-runner:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          PAGES_URL="https://${OWNER}.codeberg.page/${NAME}/"
          echo "PAGES_URL=${PAGES_URL}" >> "$GITHUB_ENV"
          cd hugo
          HUGO_PARAMS_REPOURL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            hugo --minify --baseURL "${PAGES_URL}" --destination "$GITHUB_WORKSPACE/public"

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: ${{ env.PAGES_URL }}
          server: codeberg.page
          token: ${{ forge.token }}
          source: public/
