# Build the Hugo site (tools/hugo/ config, records/ as content) and deploy to
# a git-pages server: Codeberg Pages by default, or a self-hosted instance
# whose admin sets the Actions variables PAGES_HOST (pages domain),
# PAGES_RUNNER (runner label) and optionally PAGES_SERVER (deploy target when
# the pages domain isn't directly reachable, e.g. in-cluster runners) and
# RUNNER_IMAGE (job container override, e.g. a local registry cache),
# FORGE_URL (public forge URL for repo links when the runner sees an internal
# server URL) and PAGES_ACTION (instance-local mirror of the git-pages
# action) — owner, repo and repo URL are derived from the push by
# bin/build.sh, so forks publish their own site with zero edits.
# hugo-runner (node + git + Hugo + pandoc/WeasyPrint) is maintained in its
# own repo; :latest so deploys pick up runner updates without edits here.
name: Deploy to Pages

on:
  push:
    branches: [main]
    paths:
      - 'tools/hugo/**'
      - 'records/**'
      - 'static/**'
      - 'tools/pandoc/**'
      - 'bin/build.sh'
      - '.forgejo/workflows/pages.yml'
  workflow_dispatch:

jobs:
  build-deploy:
    # Codeberg, or any instance whose admin set PAGES_HOST (unset vars = '').
    # Both slash forms: Forgejo v16 evaluates job-level if server-side
    # (forgejo/forgejo#13030), where server_url is AppURL with a trailing
    # slash; runner-side evaluation yields it without.
    if: github.server_url == 'https://codeberg.org' || github.server_url == 'https://codeberg.org/' || vars.PAGES_HOST != ''
    runs-on: ${{ vars.PAGES_RUNNER || 'codeberg-tiny-lazy' }}
    container:
      image: ${{ vars.RUNNER_IMAGE || 'codeberg.org/tb4/hugo-runner:latest' }}
    steps:
      - uses: actions/checkout@v4

      # Site + books (pdf/epub/booklet self-gate on their params) into
      # public/; PAGES_URL reaches the deploy step via $GITHUB_ENV.
      - name: Build
        run: ./bin/build.sh "$GITHUB_WORKSPACE/public"
        env:
          PAGES_HOST: ${{ vars.PAGES_HOST }}
          FORGE_URL: ${{ vars.FORGE_URL }}

      # PAGES_SERVER deploys go plain-HTTP straight to that host:port; the
      # site URL's scheme sets the request scheme, so swap https for http.
      - name: Derive deploy URL
        run: |
          DEPLOY_URL="$PAGES_URL"
          [ -n "$PAGES_SERVER" ] && DEPLOY_URL="http://${DEPLOY_URL#*://}"
          echo "DEPLOY_URL=$DEPLOY_URL" >>"$GITHUB_ENV"
        env:
          PAGES_SERVER: ${{ vars.PAGES_SERVER }}

      # PAGES_ACTION points at an instance-local mirror of the action
      # (outage resilience); unset = upstream. Forgejo evaluates
      # expressions in step uses (unlike GitHub).
      - name: Deploy to Pages
        uses: ${{ vars.PAGES_ACTION || 'https://codeberg.org/git-pages/action' }}@v2
        with:
          site: ${{ env.DEPLOY_URL }}
          server: ${{ vars.PAGES_SERVER || vars.PAGES_HOST || 'codeberg.page' }}
          token: ${{ forge.token }}
          source: public/
