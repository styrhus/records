# Build hugo-runner and push to both registries. The job container mounts
# the host docker socket (allowed by container.valid_volumes in the runner
# config, see forgejo-1 config/services.yaml).
#
# Repo Actions secrets (user tb4, scope write:package):
#   REGISTRY_TOKEN_FORGEJO   git.euh.no
#   REGISTRY_TOKEN_CODEBERG  codeberg.org
name: Build and push hugo-runner

on:
  push:
    branches: [main]
    # Site/record pushes are handled by pages.yml; no image rebuild needed.
    paths:
      - Dockerfile
      - VERSION
      - build.sh
      - .forgejo/workflows/build.yml
  workflow_dispatch:

env:
  IMAGE_NAME: tb4/hugo-runner
  FORGEJO_REGISTRY: git.euh.no
  CODEBERG_REGISTRY: codeberg.org
  REGISTRY_USER: tb4

jobs:
  build-push:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@v4

      - name: Read Hugo version
        run: echo "HUGO_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build \
            --build-arg "HUGO_VERSION=${HUGO_VERSION}" \
            -t "${FORGEJO_REGISTRY}/${IMAGE_NAME}:${HUGO_VERSION}" \
            -t "${FORGEJO_REGISTRY}/${IMAGE_NAME}:latest" \
            -t "${CODEBERG_REGISTRY}/${IMAGE_NAME}:${HUGO_VERSION}" \
            -t "${CODEBERG_REGISTRY}/${IMAGE_NAME}:latest" \
            .

      - name: Push to ${{ env.FORGEJO_REGISTRY }}
        run: |
          echo "${{ secrets.REGISTRY_TOKEN_FORGEJO }}" \
            | docker login "${FORGEJO_REGISTRY}" -u "${REGISTRY_USER}" --password-stdin
          docker push "${FORGEJO_REGISTRY}/${IMAGE_NAME}:${HUGO_VERSION}"
          docker push "${FORGEJO_REGISTRY}/${IMAGE_NAME}:latest"

      - name: Push to ${{ env.CODEBERG_REGISTRY }}
        run: |
          echo "${{ secrets.REGISTRY_TOKEN_CODEBERG }}" \
            | docker login "${CODEBERG_REGISTRY}" -u "${REGISTRY_USER}" --password-stdin
          docker push "${CODEBERG_REGISTRY}/${IMAGE_NAME}:${HUGO_VERSION}"
          docker push "${CODEBERG_REGISTRY}/${IMAGE_NAME}:latest"

      - name: Log out of registries
        if: always()
        run: |
          docker logout "${FORGEJO_REGISTRY}" || true
          docker logout "${CODEBERG_REGISTRY}" || true
