# Build the records product image, push it to the Codeberg registry, and
# write the pushed tag@sha into hugo/hugo.yaml (params.imageRef) so the
# published page always names the current build. That ref commit touches
# hugo/** only, so it triggers the pages deploy and never re-triggers this
# workflow. Needs a docker-socket runner (git.euh.no); mirror the ref
# commit to Codeberg for the page to update there.
name: Build and push records image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - VERSION
      - .forgejo/workflows/build.yml
  workflow_dispatch:

env:
  IMAGE_NAME: tb4/records
  CODEBERG_REGISTRY: codeberg.org
  REGISTRY_USER: tb4

jobs:
  build-push:
    # Docker-socket runner only; Codeberg runners cannot build images.
    if: github.server_url == 'https://git.euh.no'
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Build and push
        run: |
          IMAGE="${CODEBERG_REGISTRY}/${IMAGE_NAME}"
          docker build -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" .
          echo "${{ secrets.REGISTRY_TOKEN_CODEBERG }}" \
            | docker login "${CODEBERG_REGISTRY}" -u "${REGISTRY_USER}" --password-stdin
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}" | cut -d@ -f2)
          echo "IMAGE_REF=${IMAGE}:${VERSION}@${DIGEST}" >> "$GITHUB_ENV"

      - name: Record image ref on the page
        run: |
          sed -i "s|^  imageRef:.*|  imageRef: ${IMAGE_REF}|" hugo/hugo.yaml
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.${GITHUB_SERVER_URL#https://}"
          git add hugo/hugo.yaml
          git commit -m "chore: image ${IMAGE_REF#*/}" || exit 0
          git push origin HEAD:main

      - name: Log out of registry
        if: always()
        run: docker logout "${CODEBERG_REGISTRY}" || true
