baseURL: https://tb4.codeberg.page/records/
locale: en-no
title: Records

# The default branding theme; all design lives in hugo/themes/Fuglekasse/.
theme: Fuglekasse

# records/ is the single source of truth for content.
contentDir: ../records
# OR
# contentDir: ../docs/records

# The explicit date: field is authoritative (ordering follows it, not the
# filename); timestamp-named records without a date: fall back to the filename.
frontmatter:
  date: [':default', ':filename']

# Time zone for interpreting dates without a UTC offset (front matter date:
# and filename timestamps), so CI builds on UTC machines keep your wall-clock
# times. A root config key — the theme can't ship a default, so it lives here.
timeZone: Europe/Oslo

# Filename date extraction strips the date prefix from the slug
# (/18-41/ would collide across days); use the full filename as URL.
permalinks:
  page:
    /: /:contentbasename/

# Records are trusted first-party transcripts.
markup:
  goldmark:
    renderer:
      unsafe: true
  # Emit Chroma token classes (not inline colours) so the theme's syntax
  # CSS can switch with light/dark like the rest of the palette.
  highlight:
    noClasses: false

# No taxonomies; no RSS — the embedded RSS template would leak the
# assistant signature lines through page summaries.
disableKinds: [taxonomy, term, rss]

# Tag folders (records/<tag>/) organise files only — never render their
# auto-generated section pages, so /linux/ stays a 404 and stays out of the
# sitemap. The records inside keep their /linux/<slug>/ URLs.
cascade:
  - target:
      kind: section
    build:
      render: never
      list: never

# Repo URL for raw-link rewrites in page.html; pages.yml overrides this
# per-fork via HUGO_PARAMS_REPOURL. This value is the local-dev default.
params:
  repoURL: https://codeberg.org/tb4/records
  # Set to false to hide the footer repo link; repoURL keeps rewriting
  # relative records/ links either way. Fuglekasse defaults to true.
  # showRepoURL: false

  # Deploy command /cpd runs from the repo root after commit + push.
  # Commented out = the push-triggered Pages workflow deploys, nothing to run.
  # Point it at your own mechanism, also further up the file tree, e.g.
  # "./deploy.sh", "../deploy.sh" or "make -C ../.. deploy".
  # deployCommand: ./deploy.sh

  # Serve static assets (favicon, font, logo, pdf/epub/booklet) from a CDN pull zone
  # that fetches from this site's URL. Production builds only — local dev
  # stays site-relative. Unset serves everything from the site itself.
  # cdnURL: https://example.b-cdn.net/

  # Loud hand-written greeting atop the home page; set your own word or remove.
  greeting: Velkommen

  # Home page layout — Fuglekasse defaults to "basic"; uncomment to change.
  #   basic  — link index (default)
  #   posts  — latest N records as an excerpt feed (postsCount sets N, default 3)
  #   single — one-page document stack, _index.md on top, records per singleOrder
  #   single-flowing — one continuous conversation: only the Human/Assistant
  #            turns, no titles/tags/dates/chapters, records split by a "· · ·"
  #            divider; ordered by date per singleOrder (PDF/EPUB follow suit)
  # pageMode: single
  postsCount: 3

  # single/single-flowing mode record order: "asc" (oldest→newest, top→bottom,
  # default) or "desc" (newest at top). No effect in basic/posts modes.
  # singleOrder: asc

  # Book look (single-flowing mode only): three specially named files in
  # records/ become book furniture — forside.md the front cover (rendered
  # first, replacing the _index.md intro), side-1.md page 1 right after it,
  # bakside.md the back cover, always last. Dated records flow between them
  # per singleOrder; the PDF/EPUB drop their generated cover for forside and
  # give each special file its own page. All three are optional. Off by default.
  # bookLook: true

  # Chapter fold state in basic/single modes (numbered records/<n>/ folders):
  #   latest    — open the chapter holding the newest record, collapse the rest (default)
  #   expanded  — every chapter open
  #   collapsed — every chapter closed
  # A chapter's records/<n>/_index.md can override this with `chapterOpen: true`
  # or `chapterOpen: false`.
  # chapterState: latest

  # Floating table of contents: a collapsed button pinned top-right on the home
  # page (all modes but posts) that opens to the chapters and their records.
  # Off by default; uncomment to enable.
  # showToc: true

  # Render timestamp-fallback record titles as formatted dates, using Go/Hugo
  # date layout syntax (https://gohugo.io/methods/time/format/).
  # Remove to keep raw titles like "2026-07-06_23-25". Examples:
  #   "January 2, 2006"  → July 6, 2026    (US)
  #   "2 January 2006"   → 6 July 2026     (UK)
  #   "2006年1月2日"      → 2026年7月6日    (Chinese)
  #   "02.01.2006"       → 06.07.2026      (Russian, German)
  dateTitleFormat: "02. January 2006"

  # Show the record's date bottom-right in each post (same Go/Hugo layout
  # syntax). Remove to show no post date; a single record can opt out with
  # `showDate: false` in its front matter.
  datePostFormat: "02. January 2006 15:04"

  # Records tagged in front matter (tags: [linux, hardware]) show dim
  # "#linux #hardware" labels under the post — display only, no tag pages.
  # On by default; uncomment to hide site-wide. A single record can opt out
  # with `showTags: false` in its front matter.
  # showTags: false

  # The whole site as one PDF, built by the Pages workflow with the tooling in
  # pandoc/ and served from the site root; the footer shows a "Get PDF" link.
  # The value is the filename. Uncomment to enable both build and link.
  # pdf: tb4.pdf

  # The whole site as one EPUB, built by the same workflow step and served from
  # the site root; the footer shows a "Get EPUB" link. The value is the
  # filename. Uncommend to enable both build and link.
  # epub: tb4.epub

  # The book as a paper-saving print booklet: A5 pages placed two-up on A4
  # landscape sheets in folding order — print two-sided (flip on short edge),
  # fold the stack in half, and four site pages share each sheet of paper.
  # Built by the same workflow step (needs pypdf next to WeasyPrint); the
  # footer shows a "Get booklet" link. The value is the filename.
  # booklet: tb4-booklet.pdf

  # Brand mark pinned to the bottom-right corner of every page. Point it at a
  # file in the theme's static/ (or your own static/); remove to show none.
  logo: fuglekasse.svg

  # Browser-tab icon (<link rel="icon">). Point it at a file in static/;
  # unset falls back to the shipped fuglekasse.svg. Kept separate from logo
  # since favicons are square and logos are often not.
  # favicon: fuglekasse.svg

  # Spotify logo pinned to the bottom-left corner of every page, opposite
  # params.logo. Click opens the embedded player above it. Takes the
  # playlist's share URL (https://open.spotify.com/playlist/<id>) or embed
  # URL — both work. Unset shows no Spotify logo.
  # spotify: https://open.spotify.com/playlist/<id>

  # Look & feel — Fuglekasse ships these defaults; uncomment a line to override.
  # style:
  #   font: Architects Daughter
  #   light: { bg: "#d5d6db", fg: "#343b58", dim: "#9699a3", accent: "#34548a", surface: "#e5e6ea", card: "#f5f5f7" }
  #   dark:  { bg: "#282a36", fg: "#f8f8f2", dim: "#8b96c9", accent: "#bd93f9", surface: "#21222c", card: "#323445" }
